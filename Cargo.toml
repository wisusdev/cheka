[package]
name = "cheka"
version = "0.2.0-dev"
edition = "2024"
description = "Entorno local PHP al estilo de Laravel Valet (port en Rust)"
rust-version = "1.89"

[[bin]]
name = "cheka"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
minijinja = "2.24.0"
notify-debouncer-mini = "0.7.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["user", "fs", "socket"] }

[workspace]
members = ["ui"]
# `cargo build`/`cargo test` en la raíz compilan solo el núcleo y la CLI; la UI (Tauri)
# necesita las bibliotecas de WebKitGTK: `cargo build -p cheka-ui`.
default-members = ["."]
