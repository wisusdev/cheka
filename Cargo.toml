[package]
name = "cheka"
version = "0.2.0-dev"
edition = "2024"
description = "Entorno local PHP al estilo de Laravel Valet (port en Rust)"
rust-version = "1.85"

[[bin]]
name = "cheka-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
minijinja = "2.24.0"
nix = { version = "0.31.3", features = ["user", "fs"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
