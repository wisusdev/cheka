# Catálogo de herramientas de `cheka tools` (Windows). Mismos ids, nombres y categorías que
# tools/linux.toml, para que la CLI y la UI funcionen igual en los dos sistemas.
#
# Cada herramienta tiene:
#   detect   expresión de PowerShell que es verdadera si ya está instalada
#   version  expresión que devuelve la versión (la primera línea vale)
#   path     expresión que devuelve dónde está instalada
#   root     pasos como administrador (cheka los ejecuta con una sola ventana de UAC)
#   user     pasos como el usuario (instaladores por usuario, PATH y variables)
#
# Los pasos son PowerShell con $ErrorActionPreference = 'Stop', en una carpeta temporal.
# Disponibles (equivalen a los de bash en Linux):
#   winget_install Id…       winget install sin preguntas (como apt_install)
#   add_path ruta            agrega la ruta al PATH del usuario (como ~/.bashrc)
#   add_env NOMBRE valor     define una variable del usuario
#   has comando              ¿está el comando en el PATH?
#   app 'Nombre*'            el programa instalado (registro de Windows): .DisplayVersion…
#   app_dir 'Nombre*'        su carpeta de instalación
#   must { comando }         ejecuta un programa y falla si su código de salida no es 0
#   ver                      (en version) extrae el primer número de versión: `x --version | ver`
#   bindir programa          (en path) carpeta del ejecutable
#   $env:CHEKA_USER, $env:CHEKA_HOME, $env:CHEKA_EXE   el usuario dueño, su perfil y cheka
#   {{ db_user }}, {{ db_password }}  credenciales de [db] en cheka.toml
#
# PHP, Apache y MariaDB no están aquí: los gestiona cheka (`cheka install`).

[[tool]]
id = "sistema"
name = "Actualizar el sistema"
category = "Sistema"
description = "winget upgrade de todo, y utilidades base (Git, 7-Zip)"
detect = "$false"
root = '''
winget upgrade --all --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
winget_install Git.Git 7zip.7zip
'''

